name: Deploy

# 【诊断二分 round1】保留全部 inputs/secrets/permissions + 最小 job，
# 定位 startup_failure 属于 schema 定义还是 job 内容。
on:
  workflow_call:
    inputs:
      project:
        description: 项目 slug（小写，决定 VPS 上一切隔离标识）
        required: true
        type: string
      dockerfile:
        description: Dockerfile 路径
        required: true
        type: string
      app_target:
        description: app 镜像的构建 target
        required: true
        type: string
      migrate_target:
        description: 迁移镜像的构建 target（空 = 无数据库迁移）
        required: false
        type: string
        default: ""
      deploy_files:
        description: 需同步到 /opt/<project>/ 的文件（多行）
        required: false
        type: string
        default: "compose.yaml"
      edge_site_file:
        description: edge 站点配置文件路径（空 = 本项目不占用 edge）
        required: false
        type: string
        default: ""
      image_tag:
        description: 回滚用：指定旧 tag（空 = 本次 commit 短 sha）
        required: false
        type: string
        default: ""
      verify_url:
        description: 部署后健康验证 URL（空 = 跳过验证）
        required: false
        type: string
        default: ""
      public_images:
        description: 是否将 GHCR 镜像包设为 public（VPS 免认证拉取）
        required: false
        type: boolean
        default: false


jobs:
  build-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - name: vars
        id: vars
        run: |
          echo "tag=diagnostic" >> "$GITHUB_OUTPUT"
          echo "owner=new1333" >> "$GITHUB_OUTPUT"
