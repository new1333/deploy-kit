name: selftest
# 诊断完成后保留：调用方需显式声明 permissions，使被调用 workflow 的
# packages: write 请求落在令牌上限内（新仓库默认令牌只读）。
on: workflow_dispatch
permissions:
  contents: read
  packages: write
jobs:
  call:
    uses: new1333/deploy-kit/.github/workflows/deploy.yml@main
    secrets: inherit
    with:
      project: selftest
      dockerfile: nonexistent.Dockerfile
      app_target: runner
